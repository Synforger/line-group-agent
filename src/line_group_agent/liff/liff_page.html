<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>投票</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #ffffff;
    --text: #111111;
    --muted: #4a4e54;
    --card: #f3f4f6;
    --fill: #dfe2e6;
    --mine-fill: #bfeccf;
    --mine-edge: #06a84a;
    --problem: #b3261e;
    --focus: #1a73e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #1b1c1f;
      --text: #f1f2f4;
      --muted: #b4b8be;
      --card: #26282c;
      --fill: #3b3e44;
      --mine-fill: #17633a;
      --mine-edge: #3fd47e;
      --problem: #ff8a80;
      --focus: #8ab4f8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: 20px 16px calc(24px + env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.25rem; line-height: 1.4; margin: 0 0 4px; overflow-wrap: anywhere; }
  .note { color: var(--muted); font-size: 0.875rem; margin: 0 0 16px; }
  .note:empty { display: none; }
  ul { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 10px; }
  .option {
    position: relative;
    display: block;
    width: 100%;
    min-height: 56px;
    padding: 12px 14px;
    text-align: left;
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 2px solid transparent;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .option:disabled { cursor: default; }
  .option:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .option.mine { border-color: var(--mine-edge); }
  .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    background: var(--fill);
    transition: width 0.25s ease;
  }
  .mine .fill { background: var(--mine-fill); }
  .row { position: relative; display: flex; justify-content: space-between; gap: 12px; }
  .label { font-weight: 600; overflow-wrap: anywhere; }
  .count { flex: none; font-variant-numeric: tabular-nums; }
  .voters { position: relative; display: block; margin-top: 4px; font-size: 0.8125rem; overflow-wrap: anywhere; }
  .voters:empty { display: none; }
  .problem { color: var(--problem); font-size: 0.9375rem; margin: 0; }
  .problem:empty { display: none; }
  .notify { display: flex; align-items: center; gap: 10px; min-height: 44px; margin: 0 0 4px; }
  .notify input { width: 22px; height: 22px; flex: none; accent-color: var(--mine-edge); }
  .notify[hidden], .share-area[hidden] { display: none; }
  .hint { color: var(--muted); font-size: 0.75rem; margin: 0 0 16px; }
  .share-area { margin: 0 0 16px; }
  .share {
    display: block;
    width: 100%;
    min-height: 48px;
    padding: 0 14px;
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .share:focus-visible, .notify input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .share-area .hint { margin: 6px 2px 0; }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
<main>
  <h1 id="question">読み込み中…</h1>
  <p id="note" class="note"></p>
  <ul id="options"></ul>
  <p id="summary" class="note"></p>
  <label id="notify-field" class="notify" hidden>
    <input id="notify" type="checkbox" checked>
    <span>トークに知らせる</span>
  </label>
  <p id="notify-hint" class="hint" hidden>投票すると、「○○ に入れたよ」とあなたの発言でトークに送られます。</p>
  <div id="share-area" class="share-area" hidden>
    <button id="share" class="share" type="button">ほかのトークに送る</button>
    <p class="hint">送った先でも、このグループのメンバー以外はこの投票を開けません。</p>
  </div>
  <p id="problem" class="problem" role="status"></p>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  "use strict";

  var LIFF_ID = "__LIFF_ID__";
  var LINK_ID_PATTERN = /^[A-Za-z0-9_-]{16,64}$/;
  var POLL_PATH = "/liff/api/poll";
  var VOTE_PATH = "/liff/api/vote";
  var PROBLEMS = {
    0: "通信できませんでした。電波のよい所でもう一度開いてください。",
    401: "ログインの期限が切れました。LINE のトークから開き直してください。",
    403: "この投票は開けません。投票があったグループのメンバーだけが開けます。",
    429: "操作が続いたので、少し待ってからもう一度お願いします。",
    503: "いま LINE とつながりません。少し待ってからもう一度お願いします。"
  };
  var OTHER_PROBLEM = "うまくいきませんでした。もう一度お試しください。";
  var SHARE_PROBLEM = "ほかのトークに送れませんでした。もう一度お試しください。";
  var NOTIFY_KEY = "poll-notify-talk";
  var TALK_TYPES = ["utou", "group", "room"];
  var LIFF_URL = "https://liff.line.me/";
  var ALT_TEXT_MAX = 400;
  var BUTTON_LABEL = "投票を開く";
  var ACCENT = "#06a84a";

  var question = document.getElementById("question");
  var note = document.getElementById("note");
  var options = document.getElementById("options");
  var summary = document.getElementById("summary");
  var problem = document.getElementById("problem");
  var notifyField = document.getElementById("notify-field");
  var notifyHint = document.getElementById("notify-hint");
  var notify = document.getElementById("notify");
  var shareArea = document.getElementById("share-area");
  var shareButton = document.getElementById("share");
  var linkId = null;
  var view = null;
  var isBusy = false;
  var canTellTalk = false;

  function Failure(status) {
    this.status = status;
  }

  function showProblem(status) {
    problem.textContent = PROBLEMS[status] || OTHER_PROBLEM;
  }

  function linkIdFromAddress() {
    var found = new URLSearchParams(window.location.search).get("p");
    if (found) return found;
    var state = new URLSearchParams(window.location.search).get("liff.state");
    if (!state || state.indexOf("?") < 0) return null;
    return new URLSearchParams(state.slice(state.indexOf("?"))).get("p");
  }

  async function send(path, payload) {
    var token = liff.getIDToken();
    if (!token) throw new Failure(401);
    var response;
    try {
      response = await fetch(path, {
        method: "POST",
        cache: "no-store",
        headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    } catch (error) {
      throw new Failure(0);
    }
    if (!response.ok) throw new Failure(response.status);
    try {
      return await response.json();
    } catch (error) {
      throw new Failure(0);
    }
  }

  function noteOf(view) {
    if (view.is_closed) return "この投票は締め切られました。";
    if (view.kind === "date") return "大丈夫な日を選んでください(複数可)。もう一度押すと外れます。";
    if (view.multiple) return "複数選べます。もう一度押すと外れます。";
    return "1人1票です。別の選択肢を押すと選び直せます。";
  }

  function optionOf(view, option, index) {
    var item = document.createElement("li");
    var button = document.createElement("button");
    button.type = "button";
    button.className = option.mine ? "option mine" : "option";
    button.disabled = view.is_closed;

    var fill = document.createElement("span");
    fill.className = "fill";
    var share = view.voter_count > 0 ? Math.round((100 * option.count) / view.voter_count) : 0;
    window.requestAnimationFrame(function () {
      fill.style.width = share + "%";
    });

    var row = document.createElement("span");
    row.className = "row";
    var label = document.createElement("span");
    label.className = "label";
    label.textContent = (option.mine ? "✓ " : "") + option.label;
    var count = document.createElement("span");
    count.className = "count";
    count.textContent = option.count + "票";
    row.append(label, count);

    var voters = document.createElement("span");
    voters.className = "voters";
    voters.textContent = option.voters.join("、");

    button.append(fill, row, voters);
    button.addEventListener("click", function () {
      vote(index);
    });
    item.append(button);
    return item;
  }

  function render(next) {
    view = next;
    var focused = Array.prototype.indexOf.call(
      options.querySelectorAll("button"),
      document.activeElement
    );
    question.textContent = view.question;
    note.textContent = noteOf(view);
    options.replaceChildren.apply(
      options,
      view.options.map(function (option, index) {
        return optionOf(view, option, index);
      })
    );
    summary.textContent = view.voter_count + "人が投票しています";
    problem.textContent = "";
    if (focused >= 0) options.querySelectorAll("button")[focused].focus();
  }

  function sentenceOf(option) {
    return option.label + (view.kind === "date" ? " が行けるよ" : " に入れたよ");
  }

  async function sendMessagesAvailable() {
    try {
      if (!liff.isInClient()) return false;
      if (TALK_TYPES.indexOf((liff.getContext() || {}).type) < 0) return false;
      return (await liff.permission.query("chat_message.write")).state === "granted";
    } catch (error) {
      return false;
    }
  }

  function readNotifyChoice() {
    try {
      return window.localStorage.getItem(NOTIFY_KEY) !== "off";
    } catch (error) {
      return true;
    }
  }

  function keepNotifyChoice() {
    try {
      window.localStorage.setItem(NOTIFY_KEY, notify.checked ? "on" : "off");
    } catch (error) {
      // The choice is only not remembered.
    }
  }

  async function tellTalk(text) {
    try {
      await liff.sendMessages([{ type: "text", text: text }]);
    } catch (error) {
      // Not available from where the page was opened: the vote stands, nothing is said.
    }
  }

  async function vote(index) {
    if (isBusy) return;
    isBusy = true;
    try {
      var wasMine = view.options[index].mine;
      var next = await send(VOTE_PATH, { p: linkId, option: index });
      render(next);
      if (!wasMine && next.options[index].mine && canTellTalk && notify.checked) {
        tellTalk(sentenceOf(next.options[index]));
      }
    } catch (error) {
      showProblem(error.status);
    } finally {
      isBusy = false;
    }
  }

  function shareMessage() {
    var lines = view.options.map(function (option) {
      return { type: "text", text: "・" + option.label, size: "sm", wrap: true };
    });
    var contents = [{ type: "text", text: view.question, weight: "bold", size: "lg", wrap: true }];
    return {
      type: "flex",
      altText: ("投票: " + view.question).slice(0, ALT_TEXT_MAX),
      contents: {
        type: "bubble",
        body: { type: "box", layout: "vertical", spacing: "sm", contents: contents.concat(lines) },
        footer: {
          type: "box",
          layout: "vertical",
          contents: [
            {
              type: "button",
              style: "primary",
              color: ACCENT,
              action: {
                type: "uri",
                label: BUTTON_LABEL,
                uri: LIFF_URL + LIFF_ID + "?p=" + encodeURIComponent(linkId)
              }
            }
          ]
        }
      }
    };
  }

  async function share() {
    if (!view) return;
    try {
      await liff.shareTargetPicker([shareMessage()], { isMultiple: true });
    } catch (error) {
      problem.textContent = SHARE_PROBLEM;
    }
  }

  function shareAvailable() {
    try {
      return liff.isApiAvailable("shareTargetPicker");
    } catch (error) {
      return false;
    }
  }

  async function start() {
    try {
      await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
    } catch (error) {
      question.textContent = "ページを開けませんでした";
      showProblem(0);
      return;
    }
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    linkId = linkIdFromAddress();
    if (!linkId || !LINK_ID_PATTERN.test(linkId)) {
      question.textContent = "このリンクは開けません";
      showProblem(403);
      return;
    }
    var tellable = sendMessagesAvailable();
    try {
      render(await send(POLL_PATH, { p: linkId }));
    } catch (error) {
      question.textContent = "投票を開けませんでした";
      showProblem(error.status);
      return;
    }
    shareArea.hidden = !shareAvailable();
    canTellTalk = await tellable;
    notify.checked = readNotifyChoice();
    notifyField.hidden = !canTellTalk;
    notifyHint.hidden = !canTellTalk;
  }

  notify.addEventListener("change", keepNotifyChoice);
  shareButton.addEventListener("click", share);

  start();
})();
</script>
</body>
</html>
