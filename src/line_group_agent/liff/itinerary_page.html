<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>予定表</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #ffffff;
    --text: #111111;
    --muted: #4a4e54;
    --card: #f3f4f6;
    --grid: #e3e6ea;
    --grid-strong: #c9ced4;
    --now: #d93025;
    --problem: #b3261e;
    --focus: #1a73e8;
    --c1-bg: #dbe8fd; --c1-edge: #2f6fe4;
    --c2-bg: #d7f0e0; --c2-edge: #1f9d55;
    --c3-bg: #fdeccb; --c3-edge: #d98a00;
    --c4-bg: #fbdbe3; --c4-edge: #d63a64;
    --c5-bg: #e6dcfa; --c5-edge: #7b4fd1;
    --c6-bg: #d1eef0; --c6-edge: #1796a3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #1b1c1f;
      --text: #f1f2f4;
      --muted: #b4b8be;
      --card: #26282c;
      --grid: #2f3236;
      --grid-strong: #44484e;
      --now: #ff6b60;
      --problem: #ff8a80;
      --focus: #8ab4f8;
      --c1-bg: #1f3358; --c1-edge: #6ea2ff;
      --c2-bg: #17392a; --c2-edge: #4cc384;
      --c3-bg: #4a3708; --c3-edge: #f0b43c;
      --c4-bg: #4a1f2e; --c4-edge: #ff7fa0;
      --c5-bg: #35295c; --c5-edge: #b496ff;
      --c6-bg: #12393d; --c6-edge: #4fc9d6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 0 8px; }
  h1 { font-size: 1.25rem; line-height: 1.4; margin: 0; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 0.875rem; margin: 2px 0 0; }
  .sub:empty { display: none; }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .reload {
    flex: none;
    min-width: 44px;
    min-height: 44px;
    padding: 0 14px;
    background: var(--card);
    border: 0;
    border-radius: 22px;
    font-size: 0.875rem;
    cursor: pointer;
  }
  details { background: var(--card); border-radius: 12px; padding: 0 14px; margin: 4px 0 8px; }
  summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-size: 0.9375rem; }
  details pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: 0.875rem; margin: 0 0 12px; }
  nav {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 8px;
    padding: 8px 0;
    margin: 0 -16px;
    padding-left: 16px;
    padding-right: 16px;
    overflow-x: auto;
    background: var(--page);
    scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav[hidden] { display: none; }
  .tab {
    flex: none;
    min-height: 44px;
    padding: 0 16px;
    background: var(--card);
    border: 0;
    border-radius: 22px;
    white-space: nowrap;
    font-size: 0.9375rem;
    cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--text); color: var(--page); font-weight: 600; }
  h2 { font-size: 0.875rem; color: var(--muted); font-weight: 600; margin: 16px 0 8px; }
  .unscheduled { margin-bottom: 8px; }
  .unscheduled ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .chip {
    display: block;
    width: 100%;
    min-height: 48px;
    padding: 10px 14px;
    text-align: left;
    background: var(--card);
    border: 0;
    border-left: 4px solid var(--grid-strong);
    border-radius: 10px;
    cursor: pointer;
  }
  .chip .where { display: block; color: var(--muted); font-size: 0.8125rem; overflow-wrap: anywhere; }
  .chip .where:empty { display: none; }
  .timeline { position: relative; margin-top: 16px; }
  .gutter-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--grid); }
  .gutter-line.hour { border-top: 1px solid var(--grid-strong); }
  .hour-label {
    position: absolute;
    left: 0;
    width: 44px;
    transform: translateY(-50%);
    background: var(--page);
    padding-right: 4px;
    color: var(--muted);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .lanes { position: absolute; top: 0; bottom: 0; left: 52px; right: 0; }
  .band {
    position: absolute;
    display: block;
    padding: 4px 8px;
    overflow: hidden;
    text-align: left;
    color: var(--text);
    background: var(--band-bg);
    border: 0;
    border-left: 4px solid var(--band-edge);
    border-radius: 8px;
    cursor: pointer;
  }
  .band .time { display: block; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .band .name { display: block; font-size: 0.875rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .c1 { --band-bg: var(--c1-bg); --band-edge: var(--c1-edge); }
  .c2 { --band-bg: var(--c2-bg); --band-edge: var(--c2-edge); }
  .c3 { --band-bg: var(--c3-bg); --band-edge: var(--c3-edge); }
  .c4 { --band-bg: var(--c4-bg); --band-edge: var(--c4-edge); }
  .c5 { --band-bg: var(--c5-bg); --band-edge: var(--c5-edge); }
  .c6 { --band-bg: var(--c6-bg); --band-edge: var(--c6-edge); }
  .now { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--now); pointer-events: none; z-index: 2; }
  .now::before {
    content: "";
    position: absolute;
    left: -5px;
    top: -6px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--now);
  }
  .empty { color: var(--muted); font-size: 0.9375rem; margin: 24px 0; }
  .empty:empty { display: none; }
  .problem { color: var(--problem); font-size: 0.9375rem; margin: 12px 0 0; }
  .problem:empty { display: none; }
  dialog {
    position: fixed;
    inset: auto 0 0 0;
    margin: 0 auto;
    width: 100%;
    max-width: 560px;
    max-height: 80vh;
    padding: 0;
    overflow: auto;
    color: var(--text);
    background: var(--page);
    border: 0;
    border-radius: 16px 16px 0 0;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  .sheet { padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h2 { font-size: 1.125rem; color: var(--text); margin: 0 0 4px; overflow-wrap: anywhere; }
  .sheet .when { color: var(--muted); font-size: 0.9375rem; margin: 0 0 12px; }
  .sheet .field { margin: 0 0 12px; overflow-wrap: anywhere; }
  .sheet .field[hidden] { display: none; }
  .sheet .label { display: block; color: var(--muted); font-size: 0.75rem; }
  .sheet .note { white-space: pre-wrap; }
  .sheet a { color: var(--focus); }
  .close { min-height: 44px; width: 100%; background: var(--card); border: 0; border-radius: 12px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="title">読み込み中…</h1>
      <p id="range" class="sub"></p>
    </div>
    <button id="reload" class="reload" type="button">更新</button>
  </header>
  <details id="legacy" hidden>
    <summary>前のメモ</summary>
    <pre id="legacy-text"></pre>
  </details>
  <nav id="tabs" role="tablist" aria-label="日" hidden></nav>
  <section id="day" role="tabpanel" aria-live="polite">
    <div id="unscheduled" class="unscheduled" hidden>
      <h2>時間未定</h2>
      <ul id="unscheduled-list"></ul>
    </div>
    <div id="timeline" class="timeline"></div>
    <p id="empty" class="empty"></p>
  </section>
  <p id="problem" class="problem" role="status"></p>
</main>
<dialog id="detail" aria-labelledby="detail-title">
  <div class="sheet">
    <h2 id="detail-title"></h2>
    <p id="detail-when" class="when"></p>
    <p id="detail-place-field" class="field" hidden>
      <span class="label">場所</span>
      <span id="detail-place"></span>
      <a id="detail-map" target="_blank" rel="noopener noreferrer">地図で開く</a>
    </p>
    <p id="detail-note-field" class="field" hidden>
      <span class="label">メモ</span>
      <span id="detail-note" class="note"></span>
    </p>
    <p id="detail-url-field" class="field" hidden>
      <span class="label">リンク</span>
      <a id="detail-url" target="_blank" rel="noopener noreferrer"></a>
    </p>
    <button id="detail-close" class="close" type="button">閉じる</button>
  </div>
</dialog>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  "use strict";

  var LIFF_ID = "__LIFF_ID__";
  var LINK_ID_PATTERN = /^[A-Za-z0-9_-]{16,64}$/;
  var ITINERARY_PATH = "/liff/api/itinerary";
  var MAP_PATTERN = /^https:\/\/www\.google\.com\/maps\/search\/\?/;
  var WEB_PATTERN = /^https?:\/\/\S+$/;
  var PX_PER_MINUTE = 1.5;
  var HOUR_MINUTES = 60;
  var HALF_HOUR_MINUTES = 30;
  var COLOR_COUNT = 6;
  var REFRESH_AFTER_MS = 30000;
  var PROBLEMS = {
    0: "通信できませんでした。電波のよい所でもう一度開いてください。",
    401: "ログインの期限が切れました。LINE のトークから開き直してください。",
    403: "この予定表は開けません。予定表があったグループのメンバーだけが開けます。",
    429: "操作が続いたので、少し待ってからもう一度お願いします。",
    503: "いま LINE とつながりません。少し待ってからもう一度お願いします。"
  };
  var OTHER_PROBLEM = "うまくいきませんでした。もう一度お試しください。";

  var title = document.getElementById("title");
  var range = document.getElementById("range");
  var legacy = document.getElementById("legacy");
  var legacyText = document.getElementById("legacy-text");
  var tabs = document.getElementById("tabs");
  var unscheduled = document.getElementById("unscheduled");
  var unscheduledList = document.getElementById("unscheduled-list");
  var timeline = document.getElementById("timeline");
  var empty = document.getElementById("empty");
  var problem = document.getElementById("problem");
  var reload = document.getElementById("reload");
  var detail = document.getElementById("detail");
  var linkId = null;
  var view = null;
  var currentDay = 0;
  var nowLine = null;
  var axisStart = 0;
  var axisEnd = 0;
  var isBusy = false;
  var lastLoaded = 0;
  var opener = null;

  function Failure(status) {
    this.status = status;
  }

  function showProblem(status) {
    problem.textContent = PROBLEMS[status] || OTHER_PROBLEM;
  }

  function linkIdFromAddress() {
    var found = new URLSearchParams(window.location.search).get("i");
    if (found) return found;
    var state = new URLSearchParams(window.location.search).get("liff.state");
    if (!state || state.indexOf("?") < 0) return null;
    return new URLSearchParams(state.slice(state.indexOf("?"))).get("i");
  }

  async function send(path, payload) {
    var token = liff.getIDToken();
    if (!token) throw new Failure(401);
    var response;
    try {
      response = await fetch(path, {
        method: "POST",
        cache: "no-store",
        headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    } catch (error) {
      throw new Failure(0);
    }
    if (!response.ok) throw new Failure(response.status);
    try {
      return await response.json();
    } catch (error) {
      throw new Failure(0);
    }
  }

  function clock(minutes) {
    var hours = Math.floor(minutes / HOUR_MINUTES);
    var rest = minutes % HOUR_MINUTES;
    return hours + ":" + (rest < 10 ? "0" : "") + rest;
  }

  function timeText(item) {
    if (!item.start) return "時間未定";
    return item.end ? item.start + " – " + item.end : item.start + " –";
  }

  function monthDay(isoDate) {
    var parts = isoDate.split("-");
    return Number(parts[1]) + "/" + Number(parts[2]);
  }

  function localIsoDate() {
    var now = new Date();
    var month = now.getMonth() + 1;
    var day = now.getDate();
    return now.getFullYear() + "-" + (month < 10 ? "0" : "") + month + "-" + (day < 10 ? "0" : "") + day;
  }

  function openDetail(item, trigger) {
    opener = trigger;
    document.getElementById("detail-title").textContent = item.title;
    document.getElementById("detail-when").textContent = timeText(item);
    var placeField = document.getElementById("detail-place-field");
    placeField.hidden = !item.place;
    document.getElementById("detail-place").textContent = item.place || "";
    var map = document.getElementById("detail-map");
    map.hidden = !(item.map_url && MAP_PATTERN.test(item.map_url));
    if (!map.hidden) map.href = item.map_url;
    var noteField = document.getElementById("detail-note-field");
    noteField.hidden = !item.note;
    document.getElementById("detail-note").textContent = item.note || "";
    var urlField = document.getElementById("detail-url-field");
    var link = document.getElementById("detail-url");
    urlField.hidden = !(item.url && WEB_PATTERN.test(item.url));
    if (!urlField.hidden) {
      link.href = item.url;
      link.textContent = item.url;
    }
    if (detail.showModal) detail.showModal();
    else detail.setAttribute("open", "");
    document.getElementById("detail-close").focus();
  }

  function closeDetail() {
    if (detail.close) detail.close();
    else detail.removeAttribute("open");
    if (opener) opener.focus();
  }

  function chipOf(item) {
    var item_li = document.createElement("li");
    var button = document.createElement("button");
    button.type = "button";
    button.className = "chip";
    var name = document.createElement("span");
    name.textContent = item.title;
    var where = document.createElement("span");
    where.className = "where";
    where.textContent = item.place || "";
    button.append(name, where);
    button.addEventListener("click", function () {
      openDetail(item, button);
    });
    item_li.append(button);
    return item_li;
  }

  function bandOf(item, index) {
    var button = document.createElement("button");
    button.type = "button";
    button.className = "band c" + ((index % COLOR_COUNT) + 1);
    var top = (item.start_min - axisStart) * PX_PER_MINUTE;
    var height = (item.bottom_min - item.start_min) * PX_PER_MINUTE;
    button.style.top = top + "px";
    button.style.height = Math.max(height - 2, 0) + "px";
    button.style.left = "calc(" + (100 * item.column) / item.columns + "% + 0px)";
    button.style.width = "calc(" + 100 / item.columns + "% - 4px)";
    var time = document.createElement("span");
    time.className = "time";
    time.textContent = timeText(item);
    var name = document.createElement("span");
    name.className = "name";
    name.textContent = item.title;
    button.append(time, name);
    button.addEventListener("click", function () {
      openDetail(item, button);
    });
    return button;
  }

  function gridOf(axis) {
    var nodes = [];
    for (var minute = axis.start_min; minute <= axis.end_min; minute += HALF_HOUR_MINUTES) {
      var top = (minute - axis.start_min) * PX_PER_MINUTE;
      var line = document.createElement("div");
      var isHour = minute % HOUR_MINUTES === 0;
      line.className = isHour ? "gutter-line hour" : "gutter-line";
      line.style.top = top + "px";
      nodes.push(line);
      if (isHour) {
        var label = document.createElement("span");
        label.className = "hour-label";
        label.style.top = top + "px";
        label.textContent = clock(minute);
        nodes.push(label);
      }
    }
    return nodes;
  }

  function renderDay(day) {
    currentDay = day.day;
    Array.prototype.forEach.call(tabs.children, function (tab, index) {
      tab.setAttribute("aria-selected", String(view.days[index].day === day.day));
    });
    unscheduled.hidden = day.unscheduled.length === 0;
    unscheduledList.replaceChildren.apply(unscheduledList, day.unscheduled.map(chipOf));
    timeline.replaceChildren();
    nowLine = null;
    if (day.axis) {
      axisStart = day.axis.start_min;
      axisEnd = day.axis.end_min;
      timeline.style.height = (axisEnd - axisStart) * PX_PER_MINUTE + "px";
      var lanes = document.createElement("div");
      lanes.className = "lanes";
      lanes.append.apply(lanes, day.scheduled.map(bandOf));
      nowLine = document.createElement("div");
      nowLine.className = "now";
      nowLine.hidden = true;
      lanes.append(nowLine);
      timeline.append.apply(timeline, gridOf(day.axis));
      timeline.append(lanes);
    } else {
      timeline.style.height = "";
    }
    empty.textContent =
      !day.axis && day.unscheduled.length === 0 ? "この日の予定はまだありません。" : "";
    updateNow();
  }

  function updateNow() {
    if (!nowLine) return;
    var day = view.days.filter(function (candidate) {
      return candidate.day === currentDay;
    })[0];
    var now = new Date();
    var minute = now.getHours() * HOUR_MINUTES + now.getMinutes();
    var isToday = day && day.date && day.date === localIsoDate();
    nowLine.hidden = !(isToday && minute >= axisStart && minute <= axisEnd);
    if (!nowLine.hidden) nowLine.style.top = (minute - axisStart) * PX_PER_MINUTE + "px";
  }

  function tabOf(day) {
    var button = document.createElement("button");
    button.type = "button";
    button.className = "tab";
    button.setAttribute("role", "tab");
    button.textContent = day.label;
    button.addEventListener("click", function () {
      renderDay(day);
    });
    return button;
  }

  function firstDayToShow(days) {
    var today = localIsoDate();
    var found = days.filter(function (day) {
      return day.date === today;
    })[0];
    var keep = days.filter(function (day) {
      return day.day === currentDay;
    })[0];
    return keep || found || days[0];
  }

  function render(next) {
    view = next;
    title.textContent = view.title || "旅の予定表";
    var first = view.days[0];
    var last = view.days[view.days.length - 1];
    range.textContent = !first
      ? ""
      : first.date
        ? monthDay(first.date) + " – " + monthDay(last.date) + "(" + view.days.length + "日間)"
        : view.days.length + "日間";
    legacy.hidden = !view.legacy_text;
    legacyText.textContent = view.legacy_text || "";
    problem.textContent = "";
    tabs.hidden = view.days.length === 0;
    tabs.replaceChildren.apply(tabs, view.days.map(tabOf));
    if (view.days.length === 0) {
      unscheduled.hidden = true;
      timeline.replaceChildren();
      timeline.style.height = "";
      empty.textContent = "まだ予定がありません。グループのトークで bot に頼むと、予定が入ります。";
      return;
    }
    var day = firstDayToShow(view.days);
    renderDay(day);
    var selected = tabs.querySelector('[aria-selected="true"]');
    if (selected && selected.scrollIntoView) selected.scrollIntoView({ inline: "center", block: "nearest" });
  }

  async function load() {
    if (isBusy) return;
    isBusy = true;
    try {
      render(await send(ITINERARY_PATH, { i: linkId }));
      lastLoaded = Date.now();
    } catch (error) {
      showProblem(error.status);
    } finally {
      isBusy = false;
    }
  }

  async function start() {
    try {
      await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
    } catch (error) {
      title.textContent = "ページを開けませんでした";
      showProblem(0);
      return;
    }
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    linkId = linkIdFromAddress();
    if (!linkId || !LINK_ID_PATTERN.test(linkId)) {
      title.textContent = "このリンクは開けません";
      showProblem(403);
      return;
    }
    await load();
    if (!view) title.textContent = "予定表を開けませんでした";
  }

  reload.addEventListener("click", load);
  document.getElementById("detail-close").addEventListener("click", closeDetail);
  detail.addEventListener("click", function (event) {
    if (event.target === detail) closeDetail();
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && linkId && Date.now() - lastLoaded > REFRESH_AFTER_MS) load();
  });
  window.setInterval(updateNow, 60000);

  start();
})();
</script>
</body>
</html>
