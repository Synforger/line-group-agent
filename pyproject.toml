[project]
name = "line-group-agent"
version = "0.1.0"
description = "A LINE bot that answers in a group chat when it is mentioned, using Claude"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10",
    "fastapi>=0.115",
    "httpx>=0.27",
    "httpx2>=2.16",
    "pillow>=11",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/Synforger/line-group-agent"

[project.scripts]
line-group-agent = "line_group_agent.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/line_group_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
